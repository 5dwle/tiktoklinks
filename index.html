<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTok Links • 5DWLE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      margin-top: 40px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff0050, #00f2ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #ff0050;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #ff0050, #ff2d55);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.8; }
    .result {
      display: none;
      margin-top: 24px;
    }
    .result.show { display: block; }
    .preview {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .preview a {
      color: #00f2ea;
      text-decoration: none;
    }
    .message-preview {
      background: #1a1a1a;
      border-left: 3px solid #ff0050;
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      color: #ddd;
    }
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .share-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .share-btn:hover {
      background: #222;
      border-color: #ff0050;
    }
    .copy-success {
      display: none;
      text-align: center;
      color: #00f2ea;
      font-size: 0.9rem;
      margin-top: 12px;
    }
    footer {
      margin-top: 40px;
      color: #555;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TikTok Links</h1>
    <p class="subtitle">Search • Share • Message • 5DWLE</p>

    <div class="card">
      <label>TikTok Link</label>
      <input type="url" id="tiktokUrl" placeholder="https://www.tiktok.com/@user/video/123..." />

      <label style="margin-top: 16px;">Optional Message</label>
      <textarea id="message" placeholder="Add a message people will see when you share..."></textarea>

      <button class="btn" onclick="processLink()">Search & Prepare Share</button>
    </div>

    <div class="result" id="result">
      <div class="card">
        <div class="preview">
          <strong>Link:</strong><br>
          <a id="previewLink" href="#" target="_blank"></a>
        </div>

        <div id="msgBox" class="message-preview" style="display:none;"></div>

        <div class="share-grid">
          <button class="share-btn" onclick="copyAll()">📋 Copy Link + Message</button>
          <button class="share-btn" onclick="shareX()">𝕏 Share on X</button>
          <button class="share-btn" onclick="shareWhatsApp()">WhatsApp</button>
          <button class="share-btn" onclick="shareTelegram()">Telegram</button>
        </div>
        <div class="copy-success" id="copySuccess">Copied to clipboard ✓</div>
      </div>
    </div>
  </div>

  <footer>TikToklinks • Built for 5DWLE</footer>

  <script>
    function processLink() {
      const url = document.getElementById('tiktokUrl').value.trim();
      const msg = document.getElementById('message').value.trim();

      if (!url) {
        alert('Paste a TikTok link first');
        return;
      }

      // Basic TikTok link check
      if (!url.includes('tiktok.com')) {
        alert('That doesn’t look like a TikTok link');
        return;
      }

      document.getElementById('previewLink').textContent = url;
      document.getElementById('previewLink').href = url;

      const msgBox = document.getElementById('msgBox');
      if (msg) {
        msgBox.style.display = 'block';
        msgBox.textContent = msg;
      } else {
        msgBox.style.display = 'none';
      }

      document.getElementById('result').classList.add('show');
      document.getElementById('copySuccess').style.display = 'none';
    }

    function getShareText() {
      const url = document.getElementById('tiktokUrl').value.trim();
      const msg = document.getElementById('message').value.trim();
      return msg ? `${msg}\n\n${url}` : url;
    }

    function copyAll() {
      const text = getShareText();
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('copySuccess').style.display = 'block';
        setTimeout(() => {
          document.getElementById('copySuccess').style.display = 'none';
        }, 2000);
      });
    }

    function shareX() {
      const text = encodeURIComponent(getShareText());
      window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
    }

    function shareWhatsApp() {
      const text = encodeURIComponent(getShareText());
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function shareTelegram() {
      const text = encodeURIComponent(getShareText());
      window.open(`https://t.me/share/url?url=&text=${text}`, '_blank');
    }
  </script>
</body>
</html>
